# CI/CD パイプライン（SWE.3 Step 4.3 / SWE.5 統合ビルド）
# Pull Request 作成時にビルド・全テスト（SWE.4〜6）を自動実行する。
# 本ファイルは SUP.8（構成管理）の対象。
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (coverage enabled)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

      - name: Build (SWE.3)
        run: cmake --build build -j

      - name: Run unit tests (SWE.4)
        run: ctest --test-dir build -R unit_tests --output-on-failure

      - name: Run integration tests (SWE.5)
        run: ctest --test-dir build -R integration_tests --output-on-failure

      - name: Run qualification tests (SWE.6)
        run: ctest --test-dir build -R qualification_tests --output-on-failure

      - name: Coverage report (C0/C1)
        run: |
          pip install gcovr
          gcovr --root . --filter src/ --branches --txt --fail-under-line 100
