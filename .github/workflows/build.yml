# CI/CD パイプライン（SWE.3 Step 4.3 / SWE.4〜6 テスト自動実行）
# PR 時: ビルド + アーキテクチャ制約チェック + 全工程テスト + カバレッジゲート
# 本ファイルは SUP.8（構成管理）の対象。
#
# 注: 実運用では `container: ghcr.io/<org>/processtest-ci:<tag>`（docker/ci.Dockerfile
#     から image.yml がビルドした固定イメージ）内で実行し、ツールバージョンを
#     Quality Plan（08-13）記載値に固定すること。本サンプルでは ubuntu-latest に
#     直接インストールして代替する。
name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (sample; real ops use ci.Dockerfile image)
        # gcovr はバージョンで集計仕様が変わるため pin する（ローカル検証と同一版）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ ninja-build
          pipx install gcovr==8.6

      - name: Architecture constraint check (04-04)
        run: scripts/check_layer_deps.sh

      # PR: 変更のあった APP だけを選択ビルド・テストし CI 時間を削減する
      # （pf/・cmake/ 等の共通部変更時は自動で ALL になる。scripts/build.py 参照）
      - name: Selective build & test (PR - changed apps only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=100
          python3 scripts/build.py --changed --preset host-coverage --test

      # main への push: 常に全 APP をビルド・テストする（フルゲート）
      - name: Full build & test (main - all apps)
        if: github.event_name != 'pull_request'
        run: python3 scripts/build.py --apps ALL --preset host-coverage --test

      - name: "Coverage gate (SWE.4: ASIL-B C0/C1 100%)"
        # 対象は実装ソース（src/）のみ。契約面ヘッダの protected `= default`
        # 特殊メンバ（スライシング防止の定型・非使用）が行カバレッジに紛れ込むのを防ぐ。
        # --exclude-throw-branches / --exclude-unreachable-branches:
        #   コンパイラ生成の例外・到達不能分岐を除外し、gcov の C1 と基準を揃える
        run: |
          gcovr --root . \
                --filter 'app/[^/]+/src/' --filter 'pf/vehicle_api/src/' \
                --exclude-throw-branches --exclude-unreachable-branches \
                --txt --txt-metric branch \
                --fail-under-line 100 --fail-under-branch 100
